<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Version petite taille : tuile encre pour rester visible sur un
       onglet clair comme foncé, et G en or plat — à 16 px le facettage
       ne produirait qu'une bouillie grise. -->
  <rect width="100" height="100" rx="18" fill="#10243A"/>
  <g transform="translate(12,12) scale(0.76)">
    <mask id="g16">
      <polygon points="50,4 89.84,27 89.84,73 50,96 10.16,73 10.16,27" fill="#fff"/>
      <polygon points="50,24 72.52,37 72.52,63 50,76 27.48,63 27.48,37" fill="#000"/>
      <rect x="60" y="36" width="40" height="16" fill="#000"/>
      <rect x="56" y="52" width="44" height="11" fill="#fff"/>
    </mask>
    <rect width="100" height="100" fill="#D9B85C" mask="url(#g16)"/>
  </g>
</svg>
